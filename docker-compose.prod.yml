services:
  app:
    ports: !reset []            # không mở cổng 3000 ra ngoài
    expose: ["3000"]
    mem_limit: 192m
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  db:
    mem_limit: 256m
    command: ["postgres",
      "-c", "shared_buffers=32MB", "-c", "max_connections=20",
      "-c", "work_mem=2MB", "-c", "maintenance_work_mem=16MB",
      "-c", "effective_cache_size=128MB"]
    logging: *log

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?Thiếu DOMAIN trong .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    mem_limit: 96m
    logging: *log
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
